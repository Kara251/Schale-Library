name = "schale-server"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# 只经 api.bakivo.com 提供服务；不写这两行的话每次 deploy 都会重新打开 workers.dev
workers_dev = false
preview_urls = false

# D1 绑定：本地开发用 --local 自动建库，staging/prod 用独立 database_id
[[d1_databases]]
binding = "DB"
database_name = "schale_db"
database_id = "3a280f37-037e-4dd6-b81a-c0bc5eed01d3"

# R2 上传桶
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "schale-uploads"

[vars]
ENVIRONMENT = "production"
# 生产环境角色准入 fail-closed：不显式列出则拒绝全部登录
ADMIN_PANEL_ALLOWED_ROLES = "maintainer,admin"

# 密钥一律 wrangler secret put，不进配置文件：
# PANEL_INTERNAL_TOKEN, SESSION_SECRET, UPLOAD_MAX_BYTES_OVERRIDE
